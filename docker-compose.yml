# PostgreSQL for Step 3. Start it early: `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: emoji
      POSTGRES_PASSWORD: emoji
      POSTGRES_DB: emoji
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emoji -d emoji"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
